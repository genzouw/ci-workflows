# Dependabot configuration for automatic dependency updates
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    # cooldown: 新しいリリースが出てから PR を開くまでの待機日数。
    # SHA でピン留めしていても、上流が侵害された直後のリリースを取り込めば意味がない。
    # 取り込みを遅らせて、上流側で問題が発覚する時間を確保する。
    #
    # 値は .pinact.yaml の `min_age.value` と揃えること。揃っていないと
    # 「Dependabot が出した PR が pinact の min-age で落ちる」状態になる。
    # セキュリティ更新には cooldown が適用されないため、緊急の修正は待たされない。
    #
    # 既定値は 3 日 (2026-07-14 以降、全 version update に適用される GitHub 側の既定)。
    # ここではサプライチェーン攻撃の多くが公開後 1 週間以内に発覚している実態に合わせて 7 日にする。
    cooldown:
      default-days: 7
    reviewers:
      - "genzouw"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    ignore:
      # v23.x 以降は Node.js 24 ランタイム要求のため、GitHub Actions runner が
      # node24 を正式サポートするまではメジャーアップデートを停止する。
      - dependency-name: "DavidAnson/markdownlint-cli2-action"
        update-types: ["version-update:semver-major"]
