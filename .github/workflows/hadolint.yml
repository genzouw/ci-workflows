name: hadolint

on:
  # 他リポジトリの薄いスタブから uses: で呼び出す (トリガー定義はスタブ側)。
  workflow_call:
  push:
    branches: [main, master]
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '.hadolint.yaml'
      - '.github/workflows/hadolint.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '.hadolint.yaml'
      - '.github/workflows/hadolint.yml'

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint (Dockerfile lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 版は Renovate (.github/renovate.json の customManagers) が更新する。
      # 利用側リポジトリの pre-commit のフック (hadolint/hadolint) と版がずれると、
      # ローカルと CI で指摘が食い違う (genzouw/trim-text#253)。
      # 版を上げる PR では、下の Install hadolint が通ることを CI で確認する。
      # 上流は v2.15.0 でチェックサムの配布形式を変えており、形式が変わると版だけ上げても動かない。
      # renovate: datasource=github-releases depName=hadolint/hadolint
      HADOLINT_VERSION: v2.15.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hadolint
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          # 供給網攻撃対策として公式のチェックサムを併せて取得し整合性検証を行う。
          # v2.15.0 以降はファイルごとの .sha256 が無く、全アセット分をまとめた
          # checksums.sha256 (`<hash> *<アセット名>` 形式) だけが配布される。
          # 該当アセットの行からハッシュを抜き出し、ローカル保存名と照合する。
          asset=hadolint-linux-x86_64
          base_url="https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            -o hadolint \
            "${base_url}/${asset}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            -o checksums.sha256 \
            "${base_url}/checksums.sha256"
          expected_sha=$(awk -v asset="*${asset}" '$2 == asset {print $1}' checksums.sha256)
          if [ -z "${expected_sha}" ]; then
            echo "::error::checksums.sha256 に ${asset} の行がありません。"
            exit 1
          fi
          echo "${expected_sha}  hadolint" | sha256sum -c -
          chmod +x hadolint

      - name: Run hadolint
        id: lint
        # 既存 Dockerfile の DL3008/DL3018 等の指摘を片付けるまでは赤検知にしない。
        # 整備完了後に continue-on-error を外して赤検知に切り替える。
        # ジョブではなくこの step に付けているのは、Install hadolint の失敗まで
        # 握りつぶすと、hadolint が実行されなくなっても誰も気づけないため。
        continue-on-error: true
        run: |
          set -eu
          # リポジトリ内の全 Dockerfile を対象に lint する。
          mapfile -t dockerfiles < <(git ls-files '*Dockerfile' '*Dockerfile.*')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "Dockerfile が見つかりませんでした。スキップします。"
            exit 0
          fi
          printf 'lint 対象: %s\n' "${dockerfiles[@]}"
          "${RUNNER_TEMP}/hadolint" "${dockerfiles[@]}"

      # continue-on-error で握りつぶした失敗を、ログを開かなくても見えるようにする。
      # 握りつぶした step の outcome は failure のまま残るので、それで判定する。
      - name: Report hadolint findings
        if: always() && steps.lint.outcome == 'failure'
        run: |
          set -eu
          echo "::warning title=hadolint::hadolint (${HADOLINT_VERSION}) が指摘を検出しました。Run hadolint のログを確認してください。"
          {
            echo "### :warning: hadolint (${HADOLINT_VERSION}) が指摘を検出しました"
            echo
            echo "このジョブは指摘があっても成功扱いです (continue-on-error)。指摘の内容は \`Run hadolint\` のログにあります。"
          } >> "${GITHUB_STEP_SUMMARY}"
