name: Gitleaks

on:
  # 他リポジトリの薄いスタブから uses: で呼び出す (トリガー定義はスタブ側)。
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 毎週月曜 05:00 JST (= 日曜 20:00 UTC) に履歴全体を再スキャン
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 履歴全体をスキャンするためフルクローン
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        # workflow_call で他リポジトリから呼ばれた場合、$GITHUB_WORKSPACE には
        # 呼び出し元リポジトリが展開されるため、相対パス (./.github/actions/...)
        # では本リポジトリの composite action を解決できない。自リポジトリ参照でも
        # 絶対パス + full-commit-SHA が必要 (README「提供 composite action」参照)。
        # SHA は本リポジトリに action.yml を追加したコミットを指しており、
        # action.yml を変更する際は同じ PR 内でこの SHA も更新すること。
        uses: genzouw/ci-workflows/.github/actions/setup-gitleaks@5bb138b54e91aa3d99fb5128851c6c70b15184e6 # v1.5.15 予定 (マージ後にタグ付け)

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
