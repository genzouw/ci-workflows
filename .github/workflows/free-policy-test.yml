name: free-policy-test

# free-policy.yml の検出ロジックをフィクスチャで検証する (本リポジトリ専用)。
#
# free-policy.yml のセルフスキャンは inputs が常に空で、走査対象も本リポジトリの
# CI 定義だけなので、「違反を検出する経路」と「allowed_secrets を渡した経路」が
# 一度も実行されない。検出ロジックを変えたときの後退は、変更前後で同じ
# フィクスチャを流さないと見つからないため、tests/free-policy.sh で検証する。
#
# workflow_call は持たない。free-policy.yml に job を足すと呼び出し元リポジトリでも
# 実行されてしまうが、テストスクリプトは本リポジトリにしか無いため。

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free-policy.yml"
      - ".github/workflows/free-policy-test.yml"
      - "tests/free-policy.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/free-policy.yml"
      - ".github/workflows/free-policy-test.yml"
      - "tests/free-policy.sh"
  # 週 1 回の定期実行。対象ファイルを変更しなくても、ランナーのイメージ更新で同梱の
  # yq / awk の挙動が変わると本体が壊れうる。free-policy.yml が違反を
  # 見逃したまま「違反なし」で成功すると、全呼び出し元の検査が無言で効かなくなる。
  # job は緑のままなので、paths だけだと次に対象ファイルを触るまで気づけない。
  schedule:
    # 毎週月曜 07:17 JST (= 日曜 22:17 UTC)。他の定期実行 (trivy / gitleaks / lychee) の後に置く。
    # 毎時 0 分は GitHub 側の負荷で遅延・スキップされやすいため、分をずらしている。
    - cron: "17 22 * * 0"
  # 定期実行と同じ条件 (main・paths フィルタなし) で手動実行できるようにする。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  free-policy-test:
    name: free-policy-test (detection logic fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run free-policy fixture tests
        run: |
          set -euo pipefail
          # yq はランナー同梱のものを使う (run: の取り出しに使用)。
          yq --version
          # awk は実装ごとに挙動が違うため、ランナーにある実装 (awk / gawk / mawk) の
          # すべてで実行する。どの実装で走ったかはスクリプトが末尾に出力する。
          bash tests/free-policy.sh
