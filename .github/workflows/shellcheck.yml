name: shellcheck

on:
  # 他リポジトリの薄いスタブから uses: で呼び出す (トリガー定義はスタブ側)。
  workflow_call:
    inputs:
      shellcheck_version:
        description: 'インストールする shellcheck のバージョン (先頭の v は付けない)。上書きする場合は shellcheck_sha256 と組で指定する。省略時は 0.11.0'
        type: string
        required: false
        default: ''
      shellcheck_sha256:
        description: 'shellcheck-v<版>.linux.x86_64.tar.xz の SHA256。shellcheck_version と組で指定する'
        type: string
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '.github/actions/**'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '.github/actions/**'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (shell script lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ランナー同梱の shellcheck (ubuntu-24.04 では 0.9.0) は版が固定されず、
      # 呼び出し元の pre-commit フックと版がずれて新しい検査をすり抜けるため、
      # 公式リリースのバイナリを SHA256 検証つきで取得して使う (genzouw/ci-workflows#59)。
      #
      # setup-gitleaks のような composite action に切り出さずインラインで持つのは、
      # workflow_call で呼ばれた際の `uses: ./...` は呼び出し元リポジトリを指し、
      # 本リポジトリの action を参照するには自身のコミット SHA が必要になるため。
      #
      # 既定値を inputs の default ではなくここに置くのは、push / pull_request で
      # 直接実行されたときは inputs が空になり、default が効かないため。
      - name: Install shellcheck
        working-directory: ${{ runner.temp }}
        env:
          SHELLCHECK_VERSION: ${{ inputs.shellcheck_version || '0.11.0' }}
          SHELLCHECK_SHA256: ${{ inputs.shellcheck_sha256 || '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' }}
          VERSION_OVERRIDDEN: ${{ inputs.shellcheck_version != '' }}
          SHA256_OVERRIDDEN: ${{ inputs.shellcheck_sha256 != '' }}
        run: |
          set -euo pipefail

          # 片方だけ上書きすると、既定値と組み合わさってチェックサム検証で落ちる。
          # 原因が分かりにくいため、ここで先に失敗させる。
          if [ "$VERSION_OVERRIDDEN" != "$SHA256_OVERRIDDEN" ]; then
            echo "::error::shellcheck_version と shellcheck_sha256 は組で指定してください"
            exit 1
          fi
          if ! [[ "$SHELLCHECK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::shellcheck_version の形式が不正です: $SHELLCHECK_VERSION"
            exit 1
          fi
          if ! [[ "$SHELLCHECK_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "::error::shellcheck_sha256 の形式が不正です"
            exit 1
          fi
          # SHA256 は x86_64 版のものしか受け取らないため、他のアーキテクチャでは黙って進まず落とす。
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::Unsupported architecture: $(uname -m)"
            exit 1
          fi

          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -

          mkdir -p shellcheck-bin
          tar -xJf "$tarball" -C shellcheck-bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm -f "$tarball"
          # ランナー同梱版より優先されるよう PATH の先頭に追加する。
          echo "${RUNNER_TEMP}/shellcheck-bin" >>"$GITHUB_PATH"

      - name: Run shellcheck
        run: |
          set -euo pipefail
          # 直前のステップで入れた shellcheck を使う。取り違えに気づけるよう版を出力する。
          command -v shellcheck
          shellcheck --version
          # リポジトリ内の全シェルスクリプトを対象に lint する。
          # サードパーティ由来の vendor / node_modules 配下は対象外。
          mapfile -t scripts < <(git ls-files '*.sh' | grep -viE '(^|/)(vendor|node_modules)/' || true)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "シェルスクリプトが見つかりませんでした。スキップします。"
            exit 0
          fi
          printf 'lint 対象: %s\n' "${scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

      - name: Run shellcheck on composite action `run:` blocks
        # composite action (`action.yml`) の `run:` は独立した `.sh` ファイルではないため
        # 上のステップの対象外になる。一方 actionlint は composite action を検証できない
        # （`action.yml` を渡すと workflow スキーマとして誤解釈し `"jobs" section is
        # missing` で落ちる）ため、この抽出処理が composite action 内スクリプトを
        # lint する唯一の経路になる。
        #
        # 処理は `run:` 内にインラインで持つ。`workflow_call` で呼ばれた際に
        # チェックアウトされるのは呼び出し元リポジトリであり、本リポジトリに置いた
        # 補助スクリプトは存在しないため。
        run: |
          set -euo pipefail

          # `git ls-files` の pathspec は `*` が `/` を跨いでマッチするため、
          # `*/action.yml` で `.github/actions/<name>/action.yml` も拾える
          # (free-policy.yml の走査対象と同じ書き方)。
          # サードパーティ由来の vendor / node_modules 配下は上のステップと同様に除外する。
          mapfile -t actions < <(
            git ls-files -- 'action.yml' 'action.yaml' '*/action.yml' '*/action.yaml' \
              | grep -viE '(^|/)(vendor|node_modules)/' || true
          )
          if [ "${#actions[@]}" -eq 0 ]; then
            echo "composite action 定義が見つかりませんでした。スキップします。"
            exit 0
          fi

          # 抽出には yq (mikefarah 版 v4) を使う。ubuntu-latest ランナーに同梱されているが、
          # 将来イメージから外れたときに検証が黙ってスキップされるのを防ぐため、
          # ここでバージョンを出力して不在なら即座に失敗させる。
          yq --version

          workdir="$(mktemp -d)"
          mapping="$workdir/mapping.tsv"
          schema_errors="$workdir/schema-errors.txt"
          : >"$mapping"
          : >"$schema_errors"

          for action in "${actions[@]}"; do
            [ "$(yq -r '.runs.using // ""' "$action")" = composite ] || continue

            count="$(yq -r '.runs.steps | length' "$action")"
            for i in $(seq 0 "$((count - 1))"); do
              [ "$(yq -r ".runs.steps[$i] | has(\"run\")" "$action")" = true ] || continue

              name="$(yq -r ".runs.steps[$i].name // \"steps[$i]\"" "$action")"
              shell="$(yq -r ".runs.steps[$i].shell // \"\"" "$action")"
              line="$(yq -r ".runs.steps[$i].run | line" "$action")"
              style="$(yq -r ".runs.steps[$i].run | style" "$action")"

              # composite action の `run:` ステップでは `shell:` が必須で、欠落すると
              # 実行時に `Required property is missing: shell` でクラッシュする。
              # actionlint が検証できない領域なのでここで落とす。
              if [ -z "$shell" ]; then
                printf '%s:%s: 「shell:」の指定がありません (composite action の run ステップでは必須)\n' \
                  "$action" "$line" >>"$schema_errors"
                continue
              fi

              # bash/sh 以外 (python / pwsh 等) を shellcheck に渡すと確実に構文エラーに
              # なるため、ホワイトリスト方式で対象を限定する。
              case "$shell" in
                bash | sh) ;;
                *)
                  printf 'skip: %s :: %s (shell: %s は shellcheck の対象外)\n' "$action" "$name" "$shell"
                  continue
                  ;;
              esac

              # 一時ファイルの行番号を action.yml の行番号に揃えるため空行を前置する。
              # ブロックスカラー (`|` / `>`) は `run:` キーの次の行から本文が始まる。
              offset="$line"
              case "$style" in
                literal | folded) ;;
                *) offset="$((line - 1))" ;;
              esac

              script="$workdir/$(printf '%s' "${action}__${i}" | tr -c 'A-Za-z0-9._-' '_')"
              : >"$script"
              for _ in $(seq 1 "$offset"); do printf '\n' >>"$script"; done

              # GitHub Actions の式 (二重波括弧の補間) はシェルとして不正なので固定
              # トークンへ置換する。式の内側を `[^}]*` で表すと、`format('{0}-{1}', a, b)`
              # のように式の中に `}` を含む場合に取り残しが出て偽の構文エラーになるため、
              # 単一の `}` を許すパターンにしている。
              # さらに、GitHub Actions の format() は .NET 形式のエスケープ (`{{`/`}}` で
              # リテラルの波括弧を表現) をサポートするため、式の中に `}}` がそのまま現れる
              # ことがある (例: format('{{Hello {0}!}}', inputs.name))。単一の `}` を許す
              # だけでは、この文字列リテラル内の `}}` を式の終端と誤認してしまう。
              # そのため、式の中に現れるシングルクォート文字列 (`''` はエスケープされた
              # シングルクォート) を1トークンとしてまとめて読み飛ばし、その中の `}}` を
              # 式の終端候補から除外する。
              # 式は複数行 (YAML のブロックスカラー) にまたがることがある。単純に
              # 1トークンへ畳み込むと式の内部にあった改行が消え、それ以降の行に対する
              # lint 報告の行番号が実ファイルの行番号からずれてしまう
              # (先頭が "shellcheck" で始まる行コメントは shellcheck 側にディレクティブ
              # として誤解釈されるため、あえて言い換えている)。
              # そのため置換後も式の内部にあった改行の数だけ改行を残し、行数を保つ。
              yq -r ".runs.steps[$i].run" "$action" \
                | perl -0777 -pe '
                    s/\$\{\{((?:\x27(?:[^\x27]|\x27\x27)*\x27|[^}]|\}[^}])*)\}\}/
                      "GITHUB_EXPRESSION" . ("\n" x ($1 =~ tr|\n||))
                    /gex
                  ' >>"$script"

              printf '%s\t%s\t%s\t%s\n' "$script" "$action" "$shell" "$name" >>"$mapping"
            done
          done

          status=0

          if [ -s "$mapping" ]; then
            while IFS=$'\t' read -r script action shell name; do
              printf 'lint 対象: %s :: %s (shell: %s)\n' "$action" "$name" "$shell"
              out=""
              if ! out="$(shellcheck -s "$shell" --severity=warning --format=gcc "$script")"; then
                status=1
              fi
              if [ -n "$out" ]; then
                # 一時ファイルのパスを元の action.yml に置き換える (行番号は一致済み)。
                printf '%s\n' "$out" | sed "s#^${script}#${action}#"
              fi
            done <"$mapping"
          else
            echo "shellcheck 対象の composite action の run ブロックはありませんでした。"
          fi

          if [ -s "$schema_errors" ]; then
            echo "::error::composite action の定義に不備があります:"
            cat "$schema_errors"
            status=1
          fi

          exit "$status"
