name: fallow

# TypeScript / JavaScript の「その PR が変更したファイル」だけを見て、未使用コード・
# 重複・複雑度を判定する品質ゲート。
#
# 既存の lint との違い:
#   - typos.yml / markdownlint.yml は綴りと Markdown の構造しか見ない
#   - trivy.yml / gitleaks.yml は脆弱性とシークレットであり、コード品質は見ない
#   - 各リポジトリの ESLint は「1 ファイル内で閉じた規則」しか見ないため、
#     ファイルをまたぐ未使用 export・循環依存・コピペ重複は検出できない
#   fallow は依存グラフを組み立てて到達不能なコードを判定するため、守備範囲が重ならない。
#
# なぜ `audit` なのか (フルスキャンにしない理由):
#   導入時点の実測で、対象リポジトリはいずれも既存コードに指摘を持っている
#   (hyakuninissyu: dead-code 75 件 / toique: dead-code 12 + 重複 16 / monopo: 複雑度 33)。
#   フルスキャンを赤検知にすると、その PR と無関係な負債で全 PR が落ちて機能しない。
#   audit は判定対象を「変更ファイル」かつ「その変更で新たに導入された指摘」(既定の
#   --gate new-only) に限定するため、既存の負債を無視して「これから増えるもの」だけを
#   止められる。dependency-review.yml と同じ思想で、trivy.yml (報告のみ) と対になる。
#
# なぜ公式 Action (fallow-rs/fallow) を使わず CLI を直接実行するのか:
#   本リポジトリと配布先リポジトリはいずれも Actions の許可リストが "selected"
#   (github_owned + verified + 個別許可パターン) に設定されている。許可されていない
#   サードパーティ Action を参照したワークフローは、実行される前に startup_failure で
#   落ちる (check context を報告しないため PR のチェック一覧にも現れない)。
#   Action を使うには全リポジトリの許可リスト変更が必要になるうえ、許可リストの管理は
#   genzouw.com の Terraform 側にあり、CI の定義とは別の場所で二重管理になる。
#   CLI は npm から取得してローカルで完結するため、この制約を受けない。
#   gitleaks / hadolint を公式バイナリの直接実行にしているのと同じ判断。
#
# 課金について (AGENTS.md 1 章):
#   静的解析部分は MIT ライセンスで、ライセンスキー・API キー・Secrets をいずれも
#   必要としない。有料なのは本番トレースを取り込む Fallow Runtime だけで、本
#   ワークフローはこれを使わない。CLI の直接実行には外部 SaaS への通信も伴わない。

on:
  # 他リポジトリの薄いスタブから uses: で呼び出す (トリガー定義はスタブ側)。
  # audit は base との比較を前提とするため、pull_request 以外では動かさない。
  workflow_call:
    inputs:
      version:
        description: "使用する fallow CLI のバージョン。空なら本ワークフローの既定値を使う。"
        type: string
        required: false
        default: ""
      fail_on_issues:
        description: "変更ファイルに新たな指摘があったとき PR を落とすか。false なら報告のみ (段階導入用)。"
        type: boolean
        required: false
        default: true
  pull_request:
    branches: [main, master]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.vue"
      - "**/*.svelte"
      - "**/package.json"
      - ".fallowrc.json"
      - ".fallowrc.jsonc"
      - "fallow.toml"
      - ".fallow.toml"
      - ".github/workflows/fallow.yml"

permissions:
  contents: read

jobs:
  fallow:
    name: fallow (changed-file quality gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # audit は base との差分を見るため、履歴全体が必要。
          fetch-depth: 0
          persist-credentials: false

      - name: Audit changed files
        env:
          # CLI は npm 経由で取得されるため SHA ピン留めができず、バージョン固定が
          # 再現性を保つ唯一の手段になる。この既定値が単一の信頼できる情報源 (SSoT)。
          # npm ecosystem のマニフェストではないため Dependabot の更新対象外で、
          # 更新は手動で行う。
          FALLOW_VERSION: ${{ inputs.version || '3.28.0' }}
          # ${{ }} を run: に直接展開せず env 経由で渡す (template injection 対策)。
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # workflow_call 以外 (本リポジトリのセルフテスト) では空文字になる。
          # 明示的に false を渡されたときだけ報告のみに落とし、それ以外は落とす側へ倒す。
          ENFORCE: ${{ inputs.fail_on_issues }}
        run: |
          set -euo pipefail

          # TS/JS を持たないリポジトリから呼ばれても落ちないようにする
          # (hadolint.yml / shellcheck.yml と同じ「対象が無ければスキップ」方式)。
          # 本リポジトリ自身のセルフテストもこの分岐でスキップされる。
          mapfile -t sources < <(
            git ls-files \
              '*.ts' '*.tsx' '*.mts' '*.cts' \
              '*.js' '*.jsx' '*.mjs' '*.cjs' \
              '*.vue' '*.svelte' || true
          )
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "TypeScript / JavaScript のソースが見つかりませんでした。スキップします。"
            exit 0
          fi
          echo "解析対象候補: ${#sources[@]} ファイル"

          # base が取れない呼ばれ方をしたときは、CLI 側の merge-base 自動検出に委ねる。
          args=(audit --format human)
          if [ -n "${BASE_SHA}" ]; then
            args+=(--changed-since "${BASE_SHA}")
          else
            echo "::warning::base の SHA を取得できませんでした。CLI の merge-base 自動検出にフォールバックします。"
          fi

          status=0
          npx --yes "fallow@${FALLOW_VERSION}" "${args[@]}" || status=$?

          # 終了コードの意味: 0=pass / 1=findings または fail verdict /
          # 2=設定・実行時エラー / 3=リソース不足 / 8=security gate
          # (https://github.com/fallow-rs/fallow#exit-codes)
          case "${status}" in
            0)
              exit 0
              ;;
            1)
              if [ "${ENFORCE}" = "false" ]; then
                echo "::warning::fallow audit が指摘を検出しましたが、fail_on_issues: false のため job は成功扱いにします。"
                exit 0
              fi
              exit 1
              ;;
            *)
              # 指摘の検出ではなく fallow 自体の失敗。fail_on_issues とは無関係に落とす。
              echo "::error::fallow が予期しない終了コード ${status} で終了しました。"
              exit "${status}"
              ;;
          esac
