name: auto-tag

# main へのマージ時にリリースタグ (vX.Y.Z) を自動で作成する。
#
# 【重要】本ワークフローは reusable workflow ではない。本リポジトリ自身の
# リリース運用専用であり、他リポジトリへスタブを配布するものではない。
# (.github/workflows/ 配下の他のファイルはすべて workflow_call を持つ reusable)
#
# なぜ必要か:
#   呼び出し側リポジトリのスタブは `uses: .../<workflow>.yml@<SHA> # vX.Y.Z` の形で
#   full commit SHA を参照する。Renovate がこの SHA を追従できるのは上流にタグが
#   存在する場合だけで、タグを打ち忘れると全呼び出し元の参照が古いまま固定される。
#   タグ付けは「忘れても誰も気づかないが、忘れると更新が止まる」種類の作業なので
#   自動化する。
#
# なぜ外部 Action を使わないか:
#   本リポジトリは Actions の許可リストが "selected" に設定されており、許可されて
#   いないサードパーティ Action を参照したワークフローは startup_failure で落ちる
#   (fallow.yml のコメント参照)。リリース系 Action も同様に使えないため、判定と
#   タグ作成を自前で行う。
#
# なぜ git push ではなく gh api でタグを作るのか:
#   git push でタグを打つには checkout に認証情報を残す (persist-credentials: true)
#   必要があり、以後のステップすべてがその認証情報に触れられる状態になる。
#   gh api なら GH_TOKEN を必要なステップにだけ渡せばよく、作業ツリーに認証情報が
#   残らない。他のワークフローで徹底している persist-credentials: false を崩さない。

on:
  push:
    branches: [main]

# 近接する push で job が並行起動すると、両方が同じ「直近タグ」を起点に同じ
# バージョンを算出し、後発側の `gh api` によるタグ作成が既存 ref との衝突で
# 失敗する (その分のコミットはタグ未付与のまま放置される)。cancel-in-progress
# は先行 job のタグ作成そのものを打ち消しかねないため false にし、直列化のみ行う。
# auto-tag.yml は workflow_call を持たない非 reusable ワークフローなので、
# 運用契約3 (reusable workflow 側に concurrency を定義しない) の対象外。
concurrency:
  group: auto-tag
  cancel-in-progress: false

permissions:
  # タグ (refs/tags) の作成に必要。
  contents: write

jobs:
  auto-tag:
    name: auto-tag (release on merge)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 直近タグとそこからのコミットを読むため、履歴とタグが必要。
          fetch-depth: 0
          persist-credentials: false

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          # ${{ }} を run: に直接展開せず env 経由で渡す (template injection 対策)。
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `git tag -l` はワイルドカードであり正規表現ではないため、パターンだけでは
          # `v2.0.0-rc.1` のようなプレリリースタグも拾ってしまう。厳密な vX.Y.Z 形式
          # だけを基点候補として残す。
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"

          # concurrency group は pending run のスケジュール順を push 順と一致させない。
          # 後発 push の run が先に latest タグを作った状態で、先発 push の run が
          # 後から動くと、latest は先発 run の HEAD の祖先ではなくなる。その状態で
          # bump すると、古いコミットに新しい番号のタグが付き、リリース順序が
          # 逆転する。祖先でなければ、この run は古い push のものとして何もせず終える。
          if [ -n "${latest}" ] && ! git merge-base --is-ancestor "${latest}" HEAD; then
            echo "::warning::タグ ${latest} はこの run の HEAD (${HEAD_SHA}) の祖先ではありません。並行 push で別の run が先行した可能性があるため、古い run として終了します。"
            exit 0
          fi

          if [ -z "${latest}" ]; then
            echo "既存のタグがありません。全履歴を対象に判定します。"
            base="v0.0.0"
            # git log は引数無しで暗黙に HEAD を対象にするが、git rev-list --count は
            # 引数無しでは動作しない ("usage: git rev-list ... <commit>...") ため、
            # 明示的に HEAD を渡す。
            range=(HEAD)
            # git diff はコミット範囲ではなく比較対象の tree-ish を2つ取るため、
            # 「タグがまだ無い」を「空のツリーとの比較」として表現できる。これにより
            # 初回リリースでも CI 定義変更の有無を判定できる。
            diff_base="$(git hash-object -t tree /dev/null)"
          else
            echo "直近のタグ: ${latest}"
            base="${latest}"
            range=("${latest}..HEAD")
            diff_base="${latest}"
          fi

          # CI 定義に変更が無いなら、タグを打つ意味がない (呼び出し側が参照するのは
          # ワークフローと composite action だけ)。README だけの更新でタグ番号を
          # 消費しないようにする。既存タグが無い初回リリースでも、空のツリーを
          # 起点に同じ判定を行う。auto-tag.yml 自身は他リポジトリへ配布しない
          # (workflow_call を持たない) ため、これだけの変更でもタグ番号を消費
          # しないよう除外する。
          changed="$(git diff --name-only "${diff_base}" HEAD -- '.github/workflows' '.github/actions' ':(exclude).github/workflows/auto-tag.yml')"
          if [ -z "${changed}" ]; then
            echo "${latest:-<初回>} 以降、CI 定義に変更がありません。タグ付けをスキップします。"
            exit 0
          fi
          printf '変更された CI 定義:\n%s\n' "${changed}"

          # squash merge であれば直近タグ以降のコミットは常に1件のはず。本リポジトリは
          # Rebase and merge も許可されており (Settings > General で確認可能)、これを
          # 選ぶと main には各コミット本来のメッセージがそのまま入る。semantic-pr.yml は
          # PR タイトル (または単一コミット PR のコミットメッセージ) しか検査しないため、
          # 複数コミットの PR を rebase merge すると Conventional Commits 形式が保証され
          # ないメッセージが下の bump 判定に混入し得る。件数が1件を超える場合は警告して
          # 人が算出結果を確認できるようにする (自動では塞がない)。
          commit_count="$(git rev-list --count "${range[@]}")"
          if [ "${commit_count}" -gt 1 ]; then
            echo "::warning::直近タグ以降に ${commit_count} 件のコミットがあります。Rebase merge 等で複数コミットが一度に main へ入った場合、Conventional Commits 形式が保証されないコミットメッセージが bump 判定に混入している可能性があります。算出された bump 種別 (下記) を確認してください。"
          fi

          # Conventional Commits から bump 種別を決める。PR タイトルの規約準拠は
          # semantic-pr.yml が別途強制しているため、squash merge のコミット件名は
          # 必ず <type>[optional scope][!]: <description> の形になる (rebase merge
          # 時の注意点は直前の commit_count 警告を参照)。件名 (%s) と本文 (%b) を
          # 分けて取得する。squash merge のコミット本文は PR 本文がそのまま入るため、
          # %B (件名+本文) を丸ごと判定に使うと、PR 本文の地の文に feat: や !: と
          # 読める行があるだけで誤爆する。feat: と ! は件名だけを見て判定し、
          # BREAKING CHANGE: は Conventional Commits の仕様どおりフッター (本文) を見る。
          subjects="$(git log "${range[@]}" --format='%s')"
          bodies="$(git log "${range[@]}" --format='%b')"

          # here-string (<<<) でパイプを介さずに渡す。printf | grep -q だと、メッセージが
          # パイプバッファを超えたとき grep -q が先に一致して読み込みを終え、printf 側が
          # 閉じた pipe への書き込みで失敗し得る。set -o pipefail 下ではその失敗が
          # bump 判定を静かに変えてしまう。
          bump="patch"
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "${subjects}" \
            || grep -qE '^BREAKING[ -]CHANGE:' <<< "${bodies}"; then
            bump="major"
          elif grep -qE '^feat(\([^)]*\))?:' <<< "${subjects}"; then
            bump="minor"
          fi
          echo "bump 種別: ${bump}"

          version="${base#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          case "${bump}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          next="v${major}.${minor}.${patch}"

          # next は latest を bump した番号であり、latest 自身は 67 行目の時点で
          # 「条件を満たす最大の既存タグ」として選ばれている。そのため next と同じ
          # タグがこの checkout のローカル ref に存在することはなく、
          # `git rev-parse --verify refs/tags/${next}` は原理上常に失敗する
          # (到達しないガード)。checkout 後に他プロセスがタグを push した場合のような
          # 本当の衝突は、ローカル ref を見るこのガードでは検出できず、直後の
          # gh api がそれを 422 で検出して job を失敗させる。
          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${next}" \
            -f sha="${HEAD_SHA}" > /dev/null

          echo "タグ ${next} を ${HEAD_SHA} に作成しました。"
          {
            echo "### リリースタグ \`${next}\` を作成しました"
            echo ""
            echo "- 対象コミット: \`${HEAD_SHA}\`"
            echo "- 直前のタグ: \`${base}\`"
            echo "- bump 種別: \`${bump}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
